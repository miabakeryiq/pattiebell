  <style>
    :root {
      --bg: #ffffff;
      --surface: #f8fafc;
      --surface2: #f1f5f9;
      --border: rgba(0, 0, 0, .1);
      --gold: #f5c518;
      --gold-dim: rgba(245, 197, 24, .15);
      --gold-border: rgba(245, 197, 24, .25);
      --text: #0f172a;
      --muted: rgba(15, 23, 42, .45);
      --green: #22c55e;
      --blue: #3b82f6;
      --red: #ef4444;
      --radius: 14px;
      --radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      overscroll-behavior: none;
    }

    #root {
      min-height: 100vh;
    }

    /* ── LAYOUT ── */
    .app {
      max-width: 680px;
      margin: 0 auto;
      padding: 16px 16px 100px;
    }

    /* ── HEADER ── */
    .header {
      padding: 8px 0 20px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .header h1 {
      font-family: 'Syne', sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -.03em;
      color: var(--gold);
      line-height: 1;
    }

    .header p {
      font-size: 12px;
      color: var(--muted);
      margin-top: 5px;
    }

    /* ── STATUS BAR ── */
    .status-bar {
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .status-bar .msg {
      flex: 1;
    }

    .status-bar .count {
      font-size: 11px;
      background: var(--surface2);
      padding: 4px 8px;
      border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .status-ok {
      color: var(--green);
    }

    .status-err {
      color: var(--red);
    }

    .status-info {
      color: var(--gold);
    }

    /* ── SCREEN TABS ── */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .tab {
      flex: 1;
      padding: 11px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      cursor: pointer;
    }

    .tab.active {
      background: var(--gold-dim);
      border-color: var(--gold-border);
      color: var(--text);
      font-weight: 500;
    }

    /* ── SEARCH + ACTIONS ── */
    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .search-wrap {
      flex: 1;
      position: relative;
    }

    .search-wrap input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      padding: 12px 14px;
      transition: border-color .15s;
      -webkit-appearance: none;
    }

    .search-wrap input:focus {
      outline: none;
      border-color: var(--gold);
    }

    .search-wrap input::placeholder {
      color: var(--muted);
    }

    .btn {
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      border: 0;
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn:active {
      transform: scale(.96);
      opacity: .85;
    }

    .btn-ghost {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-dark {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-blue {
      background: var(--blue);
      color: #fff;
    }

    .btn:disabled {
      opacity: .4;
      pointer-events: none;
    }

    /* ── PUSH SELECTED BAR ── */
    .push-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 16px;
      background: rgba(10, 10, 10, .95);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: center;
      z-index: 100;
    }

    .push-bar .push-info {
      flex: 1;
      font-size: 12px;
      color: var(--muted);
    }

    .push-bar .push-info strong {
      color: var(--text);
    }

    /* ── CATEGORY HEADINGS ── */
    .category-title {
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--gold);
      margin: 18px 0 8px;
      padding-bottom: 4px;
      border-bottom: 2px solid var(--gold-border);
    }

    /* ── ITEM CARDS ── */
    .item-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 8px;
      transition: border-color .15s;
    }

    .item-card.selected {
      border-color: var(--gold);
      background: var(--gold-dim);
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .card-check {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid var(--border);
      background: var(--surface2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all .15s;
    }

    .card-check.checked {
      background: var(--gold);
      border-color: var(--gold);
    }

    .card-check.checked::after {
      content: '✓';
      font-size: 13px;
      color: #111;
      font-weight: 900;
    }

    .card-name {
      flex: 1;
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }

    .card-id {
      font-size: 10px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      margin-top: 2px;
    }

    .card-prices {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .price-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .price-label {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .price-live {
      font-size: 20px;
      font-weight: 500;
      color: var(--green);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .price-live.zero {
      color: var(--muted);
    }

    .price-input {
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 18px;
      font-weight: 500;
      padding: 10px 12px;
      width: 100%;
      -webkit-appearance: none;
      transition: border-color .15s;
      font-variant-numeric: tabular-nums;
    }

    .price-input:focus {
      outline: none;
      border-color: var(--gold);
    }

    .push-single {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      border: 0;
      border-radius: 8px;
      padding: 10px 12px;
      background: var(--blue);
      color: #fff;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
      white-space: nowrap;
      align-self: flex-end;
    }

    .push-single:active {
      transform: scale(.95);
    }

    .push-single:disabled {
      opacity: .35;
      pointer-events: none;
    }

    /* ── EMPTY STATE ── */
    .empty {
      text-align: center;
      padding: 48px 24px;
      color: var(--muted);
      font-size: 13px;
    }

    .empty-icon {
      font-size: 36px;
      margin-bottom: 12px;
    }

    /* ── LOADING SPINNER ── */
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin .6s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

      ];

      const MENU_ITEMS = [
        ...SCREEN1_ITEMS.map(i => ({ ...i, screen: SCREENS[0].id })),
        ...SCREEN2_ITEMS.map(i => ({ ...i, screen: SCREENS[1].id }))
      ];

      function money(value) {
        const n = Number(value);
        if (Number.isNaN(n)) return "0";
        return Number.isInteger(n) ? String(n) : n.toFixed(2);
      }

      function makeRows() {
        return MENU_ITEMS.map(item => ({
          ...item, livePrice: item.defaultPrice, draftPrice: String(item.defaultPrice), selected: false
        }));
      }

      function App() {
        const [apiBase] = useState(DEFAULT_API_BASE);
        const [rows, setRows] = useState(() => makeRows());
        const [activeScreen, setActiveScreen] = useState(SCREENS[0].id);
        const [search, setSearch] = useState("");
        const [status, setStatus] = useState({ msg: "Ready.", type: "info" });
        const [loading, setLoading] = useState(false);

        const screenRows = useMemo(() => rows.filter(r => r.screen === activeScreen), [rows, activeScreen]);

        const filteredRows = useMemo(() => {
          const q = search.trim().toLowerCase();
          if (!q) return screenRows;
          return screenRows.filter(r => r.name.toLowerCase().includes(q) || r.id.toLowerCase().includes(q) || r.category.toLowerCase().includes(q));
        }, [screenRows, search]);

        const groupedRows = useMemo(() => {
          const map = {};
          filteredRows.forEach(r => {
            if (!map[r.category]) map[r.category] = [];
            map[r.category].push(r);
          });
          return map;
        }, [filteredRows]);

        const selectedCount = screenRows.filter(r => r.selected).length;

        function extractPrices(payload) {
          if (!payload || typeof payload !== "object") return {};
          if (payload.prices && typeof payload.prices === "object") return payload.prices;
          if (payload.data && payload.data.prices && typeof payload.data.prices === "object") return payload.data.prices;
          return payload;
        }

        async function loadFromBackend() {
          setLoading(true);
          try {
            const res = await fetch(`${apiBase}/screens/${encodeURIComponent(activeScreen)}/prices`, { cache: "no-store" });
            if (!res.ok) throw new Error(`Failed to load prices (${res.status})`);
            const data = extractPrices(await res.json());
            let matched = 0;
            setRows(prev => prev.map(row => {
              if (row.screen !== activeScreen) return row;
              const inc = data[row.id];
              if (inc === undefined || inc === null || inc === "") return row;
              matched++;
              return { ...row, livePrice: inc, draftPrice: String(inc) };
            }));
            setStatus({ msg: matched ? `Prices loaded — ${matched} matched.` : "Connected, but no matching prices were returned.", type: matched ? "ok" : "info" });
          } catch (e) {
            setStatus({ msg: e.message || "Could not load prices.", type: "err" });
          } finally { setLoading(false); }
        }

        async function pushSelected() {
          const updates = {};
          rows.forEach(r => { if (r.screen === activeScreen && r.selected && r.draftPrice !== "") updates[r.id] = Number(r.draftPrice); });
          if (!Object.keys(updates).length) { setStatus({ msg: "Select items first.", type: "info" }); return; }
          setLoading(true);
          try {
            const res = await fetch(`${apiBase}/screens/${encodeURIComponent(activeScreen)}/prices`, {
              method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(updates)
            });
            if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error || "Push failed"); }
            const data = extractPrices(await res.json());
            setRows(prev => prev.map(r => r.screen !== activeScreen ? r : ({
              ...r,
              livePrice: data[r.id] ?? r.livePrice,
              draftPrice: data[r.id] !== undefined ? String(data[r.id]) : r.draftPrice,
              selected: false
            })));
            setStatus({ msg: `Pushed ${Object.keys(updates).length} update(s).`, type: "ok" });
          } catch (e) { setStatus({ msg: e.message || "Push failed.", type: "err" }); }
          finally { setLoading(false); }
        }

        async function pushSingle(row) {
          setLoading(true);
          try {
            const res = await fetch(`${apiBase}/screens/${encodeURIComponent(activeScreen)}/prices`, {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ [row.id]: Number(row.draftPrice) })
            });
            if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error || "Push failed"); }
            const data = extractPrices(await res.json());
            setRows(prev => prev.map(r => r.id === row.id ? {
              ...r, livePrice: data[row.id] ?? r.livePrice, draftPrice: data[row.id] !== undefined ? String(data[row.id]) : r.draftPrice, selected: false
            } : r));
            setStatus({ msg: `Updated ${row.name}.`, type: "ok" });
          } catch (e) { setStatus({ msg: e.message || "Push failed.", type: "err" }); }
          finally { setLoading(false); }
        }

        useEffect(() => { setSearch(""); loadFromBackend(); }, [activeScreen]);

        const statusClass = status.type === "ok" ? "status-ok" : status.type === "err" ? "status-err" : "status-info";

        const toggleSelect = (id) => {
          setRows(prev => prev.map(r => r.id === id ? { ...r, selected: !r.selected } : r));
        };

        const updateDraftPrice = (id, val) => {
          setRows(prev => prev.map(r => r.id === id ? { ...r, draftPrice: val } : r));
        };

        const selectAllFiltered = () => {
          const filteredIds = new Set(filteredRows.map(r => r.id));
          setRows(prev => prev.map(r => filteredIds.has(r.id) ? { ...r, selected: true } : r));
        };

        const switchScreen = (id) => {
          setRows(prev => prev.map(r => ({ ...r, selected: false })));
          setActiveScreen(id);
        };

        const deselectAll = () => {
          setRows(prev => prev.map(r => ({ ...r, selected: false })));
        };

        return React.createElement("div", { className: "app" },

          // Header
          React.createElement("div", { className: "header" },
            React.createElement("div", null,
              React.createElement("h1", null, "Pattie Bell Middleware"),
              React.createElement("p", null, "Live Screen Menu & Price Controller")
            )
          ),

          // Screen Tabs
          React.createElement("div", { className: "tabs" },
            SCREENS.map(s => React.createElement("button", {
              key: s.id,
              className: `tab ${s.id === activeScreen ? "active" : ""}`,
              onClick: () => switchScreen(s.id)
            }, s.label))
          ),

          // Status Bar
          React.createElement("div", { className: "status-bar" },
            React.createElement("span", { className: `msg ${statusClass}` },
              loading && React.createElement("span", { className: "spinner" }),
              status.msg
            ),
            React.createElement("span", { className: "count" }, `${screenRows.length} items`)
          ),

          // Controls
          React.createElement("div", { className: "controls" },
            React.createElement("div", { className: "search-wrap" },
              React.createElement("input", {
                type: "text",
                placeholder: "Search items or categories...",
                value: search,
                onChange: e => setSearch(e.target.value)
              })
            ),
            React.createElement("button", {
              className: "btn btn-ghost",
              onClick: loadFromBackend
            }, "Refresh"),
            React.createElement("button", {
              className: "btn btn-dark",
              onClick: selectAllFiltered
            }, "Select All"),
            React.createElement("button", {
              className: "btn btn-dark",
              onClick: deselectAll,
              disabled: selectedCount === 0
            }, "Clear")
          ),

          // Categorized Item Cards
          filteredRows.length === 0
            ? React.createElement("div", { className: "empty" },
              React.createElement("div", { className: "empty-icon" }, "🔍"),
              "No items match your search."
            )
            : Object.keys(groupedRows).map(cat => React.createElement("div", { key: cat },
              React.createElement("div", { className: "category-title" }, cat),
              groupedRows[cat].map(row => React.createElement("div", {
                key: row.id,
                className: `item-card ${row.selected ? "selected" : ""}`
              },
                React.createElement("div", { className: "card-top" },
                  React.createElement("div", {
                    className: `card-check ${row.selected ? "checked" : ""}`,
                    onClick: () => toggleSelect(row.id)
                  }),
                  React.createElement("div", { className: "card-name" },
                    row.name,
                    React.createElement("div", { className: "card-id" }, row.id)
                  )
                ),
                React.createElement("div", { className: "card-prices" },
                  React.createElement("div", { className: "price-field" },
                    React.createElement("span", { className: "price-label" }, "Live"),
                    React.createElement("span", { className: `price-live ${row.livePrice === 0 ? "zero" : ""}` },
                      `$${money(row.livePrice)}`
                    )
                  ),
                  React.createElement("div", { className: "price-field" },
                    React.createElement("span", { className: "price-label" }, "New Price"),
                    React.createElement("input", {
                      className: "price-input",
                      type: "number",
                      step: "0.01",
                      value: row.draftPrice,
                      onChange: e => updateDraftPrice(row.id, e.target.value)
                    })
                  ),
                  React.createElement("button", {
                    className: "push-single",
                    disabled: loading || row.draftPrice === "",
                    onClick: () => pushSingle(row)
                  }, "Push")
                )
              ))
            )),

          // Floating Push Bar for Multi-Selection
          selectedCount > 0 && React.createElement("div", { className: "push-bar" },
            React.createElement("div", { className: "push-info" },
              React.createElement("strong", null, selectedCount), " item(s) selected"
            ),
            React.createElement("button", {
              className: "btn btn-blue",
              disabled: loading,
              onClick: pushSelected
            }, "Push Selected")
          )
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
    });
  </script>
</body>

</html>
